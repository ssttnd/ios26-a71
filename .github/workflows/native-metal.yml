name: sweet-native-metal
on:
  workflow_dispatch:
    inputs:
      ios26:
        description: Build the iOS 26 SweetMetal2 compatibility bundle
        type: boolean
        default: false
  push:
    branches: [a71-gpu]
    paths:
      - "userspace/native-metal/**"
      - "tools/build-sweet-native-metal.py"
      - "tools/prepare-sweet-native-metal.py"
      - ".github/workflows/native-metal.yml"
permissions:
  contents: read

jobs:
  build:
    if: inputs.ios26 != true
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install native compiler build tools
        run: |
          brew install bison flex ninja
          echo "$(brew --prefix bison)/bin:$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build direct AIR and freedreno Metal bundle
        run: python3 tools/build-sweet-native-metal.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sweet-native-metal-ios16
          path: |
            userspace/out/native-legacy
            userspace/out/SweetNativeMetal.bundle
            userspace/out/native-metal-build.json
            userspace/out/native-metal-dependencies.txt
            userspace/out/native-metal-symbols
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p userspace/diagnostics/native-metal
          find research/sweet-native-metal-build -name '*.log' -type f -exec cp {} userspace/diagnostics/native-metal/ \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweet-native-metal-diagnostics
          path: userspace/diagnostics/native-metal/

  build-ios26:
    if: inputs.ios26 == true
    runs-on: macos-15-intel
    timeout-minutes: 100
    env:
      REDMI_SHA: 4ff9b8ea41812307b867c334c77f4c290ccf1dd8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the pinned iOS 26 renderer
        run: |
          git init -q redmi
          git -C redmi fetch -q --depth 1 https://github.com/DC28088/ios-sweet.git "$REDMI_SHA"
          git -C redmi checkout -q --detach FETCH_HEAD
          cat >> redmi/tools/prepare-sweet-native-metal.py <<'PY'

          if __name__ == '__main__':
              import os
              import subprocess
              import sys

              # Apply after the donor generates its Mesa and Objective-C sources.
              generated = sys.argv[1]
              subprocess.run(['git', 'init', '-q', generated], check=True)
              subprocess.run(['git', '-C', generated, 'apply', os.environ['A71_METAL_PATCH']], check=True)
              subprocess.run(['git', '-C', generated, 'apply', os.environ['A71_BLUR_PATCH']], check=True)
              subprocess.run(['git', '-C', generated, 'apply', os.environ['A71_LEVEL_PATCH']], check=True)
              subprocess.run(['git', '-C', generated, 'apply', os.environ['A71_BUFFER_TEXTURE_PATCH']], check=True)
              subprocess.run(['git', '-C', generated, 'apply', os.environ['A71_MPS_POINTER_PATCH']], check=True)
              # Mesa patch: prepare_mesa applies everything listed from tools/mesa.
              import shutil
              shutil.copy2(os.environ['A71_IR3_SAMPLER_PATCH'],
                           os.path.join(generated, 'tools', 'mesa', 'a71-ir3-sampler-index.patch'))
              shutil.copy2(os.environ['A71_MESA_BUFFER_TEXTURE_PATCH'],
                           os.path.join(generated, 'tools', 'mesa', 'a71-freedreno-buffer-texture.patch'))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('redmi/tools/build-sweet-native-metal.py')
          s = p.read_text()
          old = "'ir3-shift-split.patch','ir3-ssbo-subdword.patch'):"
          assert s.count(old) == 1, 'donor Mesa patch list changed'
          p.write_text(s.replace(old, "'ir3-shift-split.patch','ir3-ssbo-subdword.patch','a71-ir3-sampler-index.patch','a71-freedreno-buffer-texture.patch'):"))
          PY
      - name: Build the SweetMetal2 compatibility bundle
        env:
          A71_METAL_PATCH: ${{ github.workspace }}/userspace/native-metal/ios26-mip-views.patch
          A71_BLUR_PATCH: ${{ github.workspace }}/userspace/native-metal/ios26-blur-attachments.patch
          A71_LEVEL_PATCH: ${{ github.workspace }}/userspace/native-metal/ios26-image-write-levels.patch
          A71_BUFFER_TEXTURE_PATCH: ${{ github.workspace }}/userspace/native-metal/ios26-buffer-textures.patch
          A71_MPS_POINTER_PATCH: ${{ github.workspace }}/userspace/native-metal/ios26-mps-pointer-cells.patch
          A71_MESA_BUFFER_TEXTURE_PATCH: ${{ github.workspace }}/userspace/native-metal/mesa-freedreno-buffer-texture.patch
          A71_IR3_SAMPLER_PATCH: ${{ github.workspace }}/userspace/native-metal/mesa-ir3-sampler-index.patch
        run: |
          brew install bison flex ninja
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          python3 redmi/tools/build-sweet-native-metal.py
      - uses: actions/upload-artifact@v4
        with:
          name: a71-sweet-metal26
          path: redmi/userspace/out/native-legacy/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a71-sweet-metal26-build-logs
          path: redmi/research/sweet-native-metal-build/*.log
