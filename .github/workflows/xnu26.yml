name: A71 XNU 26

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner for the XNU build
        default: macos-15-intel
      adreno:
        description: Include the SM7150 Adreno 618 and A71 bundle installer patches
        type: boolean
        default: false

permissions:
  contents: read

env:
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  BERGAMOTA_SHA: 37a7a7a917fc09945ed2f7d1ae68b84d4525b4cb
  REDMI_SHA: 4ff9b8ea41812307b867c334c77f4c290ccf1dd8
  MACOS_VERSION: "26.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET
  LC_ALL: C

jobs:
  ramdisk:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build HFSX RAM disk with diagnostic PID 1
        run: |
          mkdir -p out smoke-root/sbin smoke-root/dev
          xcrun clang -target arm64-apple-ios26.0 -c tools/sweet-init.S -o sweet-init.o
          python3 tools/mkinit.py sweet-init.o smoke-root/sbin/launchd
          chmod 755 smoke-root/sbin/launchd
          hdiutil create -quiet -size 16m -layout NONE -fs HFSX -volname A71Smoke \
            -format UDRW -srcfolder smoke-root out/a71-smoke.dmg
          python3 tools/hfsread.py out/a71-smoke.dmg --dump /sbin/launchd check-launchd
          cmp smoke-root/sbin/launchd check-launchd
          PYTHONPATH=tools python3 -c "from hfsread import HFS; assert HFS('out/a71-smoke.dmg').info('/dev')['type'] == 'dir'"
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from

          blob = Path('out/a71-smoke.dmg').read_bytes()
          assert blob[1024:1026] == b'HX', 'HFSX volume must start at offset 0'
          block_size, block_count = unpack_from('>II', blob, 1024 + 40)
          size = block_size * block_count
          assert 0 < size <= len(blob), 'invalid HFS volume size'
          Path('out/a71-smoke.hfs').write_bytes(blob[:size])
          PY
          (cd out && shasum -a 256 a71-smoke.hfs > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: a71-ramdisk
          path: |
            out/a71-smoke.hfs
            out/SHA256SUMS
          if-no-files-found: error

  kernel:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage XNU build dependencies and patches
        env:
          BUILD_ADRENO: ${{ inputs.adreno }}
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build "$DXB_SHA"
          git -C dxb checkout -q --detach FETCH_HEAD
          git init -q berg
          git -C berg fetch -q --depth 1 https://github.com/ry-diffusion/Bergamota "$BERGAMOTA_SHA"
          git -C berg checkout -q --detach FETCH_HEAD
          if [ "$BUILD_ADRENO" = true ]; then
            git init -q redmi
            git -C redmi fetch -q --depth 1 https://github.com/DC28088/ios-sweet "$REDMI_SHA"
            git -C redmi checkout -q --detach FETCH_HEAD
            python3 tools/stage-xnu26.py dxb berg --adreno-donor redmi
          else
            python3 tools/stage-xnu26.py dxb berg
          fi
      - name: Select Xcode and install build tools
        run: |
          xc=$(find /Applications -maxdepth 1 -name 'Xcode_26.1*.app' | sort -V | tail -1)
          if [ -z "$xc" ]; then
            xc=$(find /Applications -maxdepth 1 -name 'Xcode_26.*.app' | sort -V | head -1)
          fi
          test -n "$xc"
          echo "DEVELOPER_DIR=$xc/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$xc"
          xcodebuild -version
          brew install jq gum bash cmake ninja
          # Xcode is already selected. Satisfy the builder's xcodes check on older runner images.
          if ! command -v xcodes >/dev/null; then
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
            sudo chmod +x /usr/local/bin/xcodes
          fi
      - name: Build XNU 12377
        working-directory: dxb
        run: |
          rc=0
          bash build.sh > build.log 2>&1 || rc=$?
          tail -80 build.log
          if [ "$rc" -ne 0 ]; then
            grep -aE 'error:|Required project patch rejected' build.log | tail -100 || true
          fi
          exit "$rc"
      - name: Collect build log
        if: always()
        run: |
          mkdir -p out
          if [ -f dxb/build.log ]; then gzip -c dxb/build.log > out/build.log.gz; fi
          if [ -f dxb/series-SHA256SUMS ]; then cp dxb/series-SHA256SUMS out/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu26-build-log
          path: out/
          if-no-files-found: warn
      - name: Verify and publish kernel
        env:
          BUILD_ADRENO: ${{ inputs.adreno }}
        run: |
          src=dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          grep -aFq 'xnu-12377.121.6' "$src"
          grep -aFq 'Samsung S6SY771 (sec_ts)' "$src"
          if [ "$BUILD_ADRENO" = true ]; then
            grep -aFq 'SWEET GPU: GPUCC audit v2' "$src"
            grep -aFq 'SWEET RENDER: Metal plugin' "$src"
            grep -aFq 'SWEET PAYLOAD: finished' "$src"
          fi
          cp "$src" dxb/series-SHA256SUMS out/
          (cd out && shasum -a 256 kernel.development.sweet > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xnu26-kernel
          path: |
            out/kernel.development.sweet
            out/series-SHA256SUMS
            out/SHA256SUMS
          if-no-files-found: error
